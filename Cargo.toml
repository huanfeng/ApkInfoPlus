[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/huanfeng/apkinfoplus"

[workspace.dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# 应用（crates/app）的 release 档：体积优先。windui 的说明里强调 macOS 下
# `panic = "abort"` 会让 objc2 的 catch-all 失效，这里保留 unwind。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# 开发期直接用本地的 windui 源码（与 WindInput / wind-setting 同一布局：仓库并排放在 ~/develop/windinput）。
# 库里新加的 API（如 `text_input().frameless()`）发布到 crates.io 后可以去掉这一段。
[patch.crates-io]
windui = { path = "../../../windinput/wind-ui-rust" }
