name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # 拉上游最新 LibChecker 规则，测试也跑真实规则与上游 fixtures（见 docs/libchecker.md §4）
      - name: 同步 LibChecker 规则
        run: python3 scripts/sync-libchecker-rules.py
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build (release)
        run: cargo build --release -p apkinfoplus
      - uses: actions/upload-artifact@v4
        with:
          name: apkinfoplus-${{ matrix.os }}
          path: |
            target/release/apkinfoplus
            target/release/apkinfoplus.exe
          if-no-files-found: ignore
